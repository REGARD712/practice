<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳跃球跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #12102a;
            font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
            cursor: pointer;
        }

        /* 屏幕上的浮动按钮层 */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            pointer-events: none;
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .panel {
            pointer-events: none;
            background: rgba(255, 255, 255, 0.92);
            border: 6px solid #2b2140;
            border-radius: 26px;
            padding: 26px 34px;
            box-shadow: 0 14px 0 rgba(43, 33, 64, 0.35), 0 0 0 6px rgba(255, 255, 255, 0.35);
            max-width: 88vw;
            animation: pop 0.35s cubic-bezier(.2, 1.6, .5, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.7);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        h1 {
            font-size: clamp(28px, 6vw, 56px);
            line-height: 1.1;
            background: linear-gradient(90deg, #ff5f6d, #ff9966, #ffd34e, #4ade80, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 3px 0 rgba(43, 33, 64, .25));
        }

        .sub {
            color: #5b5375;
            font-size: clamp(13px, 2.6vw, 17px);
            margin-top: 8px;
            line-height: 1.6;
        }

        .big {
            font-size: clamp(22px, 5vw, 40px);
            color: #2b2140;
            font-weight: 700;
        }

        .label {
            color: #7b7396;
            font-size: clamp(12px, 2.4vw, 15px);
            letter-spacing: 1px;
        }

        .btn {
            pointer-events: auto;
            margin-top: 6px;
            font-family: inherit;
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 700;
            color: #fff;
            border: none;
            cursor: pointer;
            padding: 14px 42px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffb84d, #ff8a1f);
            box-shadow: 0 7px 0 #c25e00, 0 12px 20px rgba(0, 0, 0, .25);
            transition: transform .08s ease, box-shadow .08s ease;
            letter-spacing: 2px;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #c25e00, 0 4px 10px rgba(0, 0, 0, .25);
        }

        .btn.green {
            background: linear-gradient(180deg, #7ef29b, #2fce63);
            box-shadow: 0 7px 0 #1c8b3f, 0 12px 20px rgba(0, 0, 0, .25);
        }

        .btn.green:active {
            box-shadow: 0 2px 0 #1c8b3f, 0 4px 10px rgba(0, 0, 0, .25);
        }

        #record {
            color: #ff8a1f;
            font-weight: 700;
            font-size: clamp(15px, 3vw, 22px);
            animation: blink 0.9s ease-in-out infinite alternate;
        }

        @keyframes blink {
            from {
                transform: scale(1)
            }

            to {
                transform: scale(1.12)
            }
        }

        .hint {
            color: rgba(255, 255, 255, .95);
            font-size: clamp(13px, 2.6vw, 17px);
            text-shadow: 0 2px 6px rgba(0, 0, 0, .5);
            margin-top: 2px;
        }

        #muteBtn {
            position: absolute;
            top: 14px;
            right: 14px;
            pointer-events: auto;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 4px solid #2b2140;
            background: rgba(255, 255, 255, .9);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(43, 33, 64, .3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #muteBtn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(43, 33, 64, .3);
        }
    </style>
</head>

<body>
    <div id="stage">
        <canvas id="game" width="960" height="540"></canvas>

        <!-- 开始界面 -->
        <div class="overlay" id="startScreen">
            <div class="panel">
                <h1>跳跃球跑酷</h1>
                <div class="sub">点击 / 按空格，让小球跳过障碍<br>跑得越久，速度越快，分数越高！</div>
            </div>
            <button class="btn green" id="playBtn">开始游戏</button>
            <div class="hint">记录保持者：最高分 <span id="startBest">0</span></div>
        </div>

        <!-- 结束界面 -->
        <div class="overlay hidden" id="overScreen">
            <div class="panel">
                <div class="label">本局分数</div>
                <div class="big" id="finalScore">0</div>
                <div id="record" style="display:none">🏆 新纪录！</div>
                <div class="label" style="margin-top:10px">历史最高分 <span id="finalBest">0</span></div>
            </div>
            <button class="btn" id="retryBtn">再玩一次</button>
            <div class="hint">点击任意位置也可重试</div>
        </div>

        <button id="muteBtn" title="音效开关">🔊</button>
    </div>

    <script>
        /* =========================================================
           跳跃球跑酷 —— 单文件小游戏
           全部音效由 Web Audio API 实时合成，无需任何外部资源
           ========================================================= */

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;    // 逻辑宽度 960
        const H = canvas.height;   // 逻辑高度 540

        /* ---------- 世界参数 ---------- */
        const GROUND_Y = 432;    // 地面线
        const BALL_X = 170;    // 小球固定的横坐标
        const BALL_R = 26;     // 小球半径
        const GRAVITY = 2500;   // 重力加速度 px/s²
        const JUMP_V = -900;   // 起跳速度 px/s
        const SPEED_BASE = 360;    // 初始滚动速度 px/s
        const SPEED_ADD = 9;      // 每秒增加速度
        const SPEED_MAX = 1050;   // 速度上限

        /* ---------- 游戏状态 ---------- */
        let state = 'ready';       // ready | playing | over
        let speed, distance, score, best;
        let ball, obstacles, particles, popups, clouds, bushes;
        let spawnTimer, groundOffset, timeAcc, shake, flash;
        let lastTs = 0;
        let overAt = 0;            // 死亡时刻，用于防止连点立刻重开

        best = parseInt(localStorage.getItem('jumpball_best') || '0', 10);

        /* =========================================================
           音效引擎（Web Audio API 实时合成）
           ========================================================= */
        let audioCtx = null;
        let muted = false;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        /** 播放一个简单的合成音符 */
        function tone(freq, dur, type = 'square', vol = 0.18, slideTo = null) {
            if (muted || !audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + dur + 0.02);
        }

        /** 噪声（用于落地“噗”、撞击） */
        function noise(dur, vol = 0.25, filterFreq = 900) {
            if (muted || !audioCtx) return;
            const t = audioCtx.currentTime;
            const len = Math.floor(audioCtx.sampleRate * dur);
            const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = audioCtx.createBufferSource(); src.buffer = buf;
            const flt = audioCtx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = filterFreq;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(flt).connect(gain).connect(audioCtx.destination);
            src.start(t);
        }

        const SFX = {
            jump() { tone(430, 0.16, 'square', 0.16, 780); },
            land() { noise(0.10, 0.20, 700); },
            score() { tone(880, 0.10, 'triangle', 0.14); setTimeout(() => tone(1320, 0.12, 'triangle', 0.13), 80); },
            dash() { tone(300, 0.30, 'sawtooth', 0.12, 900); },   // 提速提示
            hit() { noise(0.28, 0.35, 500); tone(200, 0.35, 'sawtooth', 0.22, 60); },
            over() { [660, 550, 440, 330].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.18), i * 130)); },
            click() { tone(700, 0.08, 'square', 0.14); }
        };

        /* =========================================================
           初始化一局
           ========================================================= */
        function resetGame() {
            speed = SPEED_BASE;
            distance = 0;
            score = 0;
            timeAcc = 0;
            shake = 0;
            flash = 0;
            spawnTimer = 1.15;          // 首个障碍出现前留一点缓冲
            groundOffset = 0;
            ball = { y: GROUND_Y - BALL_R, vy: 0, onGround: true, squash: 0, blink: 0, blinkTimer: 2, rot: 0, dustTimer: 0 };
            obstacles = [];
            particles = [];
            popups = [];
            // 云朵（视差层）
            clouds = [];
            for (let i = 0; i < 6; i++) {
                clouds.push({ x: Math.random() * W * 1.4, y: 40 + Math.random() * 170, s: 0.6 + Math.random() * 0.8, spd: 14 + Math.random() * 22 });
            }
            // 近景灌木（视差层）
            bushes = [];
            for (let i = 0; i < 10; i++) {
                bushes.push({ x: i * 130 + Math.random() * 60, y: GROUND_Y + 4 + Math.random() * 6, s: 0.7 + Math.random() * 0.7, c: Math.floor(Math.random() * 3) });
            }
            nextMilestone = 100;
        }
        let nextMilestone = 100;

        /* =========================================================
           障碍物生成
           ========================================================= */
        const OBSTACLE_TYPES = [
            // 低矮方块：容易跳过
            { w: 42, h: 62, color: '#ff5f6d', dark: '#c62a3c' },
            // 高柱：需要更早起跳
            { w: 38, h: 104, color: '#38bdf8', dark: '#0e7fb8' },
            // 宽矮墩：跨过去
            { w: 84, h: 48, color: '#a78bfa', dark: '#6d4dd1' },
            // 双层仙人掌式
            { w: 46, h: 86, color: '#4ade80', dark: '#1e9c4c' },
            // 小尖刺群
            { w: 66, h: 54, color: '#ffd34e', dark: '#d19b00' }
        ];

        function spawnObstacle() {
            const t = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
            // 随速度提升，允许出现更高的障碍（难度渐进）
            const diff = Math.min(1, (speed - SPEED_BASE) / (SPEED_MAX - SPEED_BASE));
            const hBoost = Math.random() < diff * 0.6 ? 18 : 0;
            const h = t.h + hBoost;
            obstacles.push({
                x: W + 60,
                w: t.w,
                h: h,
                y: GROUND_Y - h,
                color: t.color,
                dark: t.dark,
                face: Math.random() < 0.7,
                bob: Math.random() * Math.PI * 2
            });
        }

        /* =========================================================
           输入
           ========================================================= */
        function jump() {
            if (state !== 'playing') return;
            if (ball.onGround) {
                ball.vy = JUMP_V;
                ball.onGround = false;
                ball.squash = -0.35;
                SFX.jump();
                // 起跳尘土
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: BALL_X + (Math.random() - 0.5) * 20,
                        y: GROUND_Y,
                        vx: (Math.random() - 0.5) * 160,
                        vy: -Math.random() * 120 - 20,
                        life: 0.5, max: 0.5, r: 3 + Math.random() * 4,
                        c: 'rgba(255,255,255,0.9)'
                    });
                }
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                initAudio();
                if (state === 'ready') startGame();
                else if (state === 'over') { if (performance.now() - overAt > 600) startGame(); }
                else jump();
            }
        });
        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            initAudio();
            if (state === 'ready') startGame();
            else if (state === 'over') { if (performance.now() - overAt > 600) startGame(); }
            else jump();
        });

        /* =========================================================
           界面按钮
           ========================================================= */
        const startScreen = document.getElementById('startScreen');
        const overScreen = document.getElementById('overScreen');
        const playBtn = document.getElementById('playBtn');
        const retryBtn = document.getElementById('retryBtn');
        const muteBtn = document.getElementById('muteBtn');

        document.getElementById('startBest').textContent = best;

        function startGame() {
            initAudio();
            SFX.click();
            resetGame();
            state = 'playing';
            startScreen.classList.add('hidden');
            overScreen.classList.add('hidden');
        }
        playBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });
        retryBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });

        muteBtn.addEventListener('click', e => {
            e.stopPropagation();
            muted = !muted;
            muteBtn.textContent = muted ? '🔇' : '🔊';
            if (!muted) { initAudio(); SFX.click(); }
        });

        function gameOver() {
            state = 'over';
            overAt = performance.now();
            SFX.hit();
            setTimeout(() => SFX.over(), 220);
            shake = 18;
            flash = 0.6;
            const final = Math.floor(score);
            const isRecord = final > best;
            if (isRecord) {
                best = final;
                localStorage.setItem('jumpball_best', String(best));
            }
            document.getElementById('finalScore').textContent = final;
            document.getElementById('finalBest').textContent = best;
            document.getElementById('record').style.display = isRecord ? 'block' : 'none';
            setTimeout(() => overScreen.classList.remove('hidden'), 520);
        }

        /* =========================================================
           主循环
           ========================================================= */
        function update(dt) {
            // 云朵永远在飘（即使未开始也给背景生命感）
            for (const c of clouds) {
                c.x -= c.spd * dt * (state === 'playing' ? 1 : 0.35);
                if (c.x < -160) { c.x = W + Math.random() * 200; c.y = 40 + Math.random() * 170; }
            }

            if (state !== 'playing') {
                // 待机时小球轻微呼吸
                if (state === 'ready') {
                    ball.blinkTimer -= dt;
                    if (ball.blinkTimer <= 0) { ball.blink = 0.14; ball.blinkTimer = 2 + Math.random() * 2.5; }
                    ball.blink = Math.max(0, ball.blink - dt);
                }
                updateParticles(dt);
                return;
            }

            timeAcc += dt;

            // 速度随时间提升
            const newSpeed = Math.min(SPEED_MAX, SPEED_BASE + timeAcc * SPEED_ADD);
            if (Math.floor(newSpeed / 100) > Math.floor(speed / 100)) SFX.dash();  // 每次提速区间奏效
            speed = newSpeed;

            const move = speed * dt;
            distance += move;
            groundOffset = (groundOffset + move) % 80;

            /* --- 小球物理 --- */
            ball.vy += GRAVITY * dt;
            ball.y += ball.vy * dt;
            ball.rot += (speed * dt) / BALL_R;          // 滚动
            // 挤压回弹
            ball.squash += (0 - ball.squash) * Math.min(1, dt * 10);

            if (ball.y >= GROUND_Y - BALL_R) {
                ball.y = GROUND_Y - BALL_R;
                if (!ball.onGround) {
                    ball.onGround = true;
                    ball.squash = 0.30;
                    SFX.land();
                    // 落地尘土
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: BALL_X + (Math.random() - 0.5) * 30,
                            y: GROUND_Y,
                            vx: (Math.random() - 0.5) * 220,
                            vy: -Math.random() * 90 - 10,
                            life: 0.45, max: 0.45, r: 3 + Math.random() * 5,
                            c: 'rgba(255,255,255,0.85)'
                        });
                    }
                }
                ball.vy = 0;
            }

            // 眨眼
            ball.blinkTimer -= dt;
            if (ball.blinkTimer <= 0) { ball.blink = 0.14; ball.blinkTimer = 2 + Math.random() * 3; }
            ball.blink = Math.max(0, ball.blink - dt);

            // 滚动时脚下冒小尘
            ball.dustTimer -= dt;
            if (ball.onGround && ball.dustTimer <= 0) {
                ball.dustTimer = 0.09;
                particles.push({
                    x: BALL_X - 14, y: GROUND_Y,
                    vx: -60 - Math.random() * 80, vy: -Math.random() * 50,
                    life: 0.35, max: 0.35, r: 2 + Math.random() * 3,
                    c: 'rgba(255,220,150,0.8)'
                });
            }

            /* --- 障碍物 --- */
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnObstacle();
                // 间隔随速度缩短，但保证有足够反应距离
                const gapTime = 0.95 + Math.random() * 0.75 - Math.min(0.30, timeAcc * 0.005);
                spawnTimer = Math.max(0.70, gapTime);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= move;
                o.bob += dt * 6;
                if (o.x + o.w < -40) { obstacles.splice(i, 1); continue; }

                // 碰撞检测（小球用内缩的圆近似，手感更宽容）
                const bx = BALL_X, by = ball.y;
                const rr = BALL_R * 0.82;
                const nx = Math.max(o.x, Math.min(bx, o.x + o.w));
                const ny = Math.max(o.y, Math.min(by, o.y + o.h));
                const dx = bx - nx, dy = by - ny;
                if (dx * dx + dy * dy < rr * rr) {
                    // 撞碎特效
                    for (let k = 0; k < 22; k++) {
                        particles.push({
                            x: bx, y: by,
                            vx: (Math.random() - 0.5) * 520,
                            vy: (Math.random() - 0.5) * 520,
                            life: 0.8, max: 0.8, r: 3 + Math.random() * 7,
                            c: o.color
                        });
                    }
                    gameOver();
                    return;
                }
            }

            /* --- 分数（按跑过的距离计） --- */
            const prevScore = Math.floor(score);
            score = distance / 22;
            if (Math.floor(score) > prevScore) {
                // 每 100 分来一次庆祝音 + 弹字
                if (score >= nextMilestone) {
                    nextMilestone += 100;
                    SFX.score();
                    popups.push({ x: BALL_X, y: ball.y - 50, text: '+' + Math.floor(score), life: 1.0, max: 1.0, hue: (timeAcc * 90) % 360 });
                    for (let k = 0; k < 16; k++) {
                        particles.push({
                            x: BALL_X, y: ball.y,
                            vx: (Math.random() - 0.5) * 420,
                            vy: -Math.random() * 380 - 60,
                            life: 0.9, max: 0.9, r: 2 + Math.random() * 6,
                            c: `hsl(${Math.random() * 360},90%,65%)`
                        });
                    }
                }
            }

            updateParticles(dt);
            shake = Math.max(0, shake - dt * 40);
            flash = Math.max(0, flash - dt * 2.2);
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += 900 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = popups.length - 1; i >= 0; i--) {
                const p = popups[i];
                p.y -= 60 * dt;
                p.life -= dt;
                if (p.life <= 0) popups.splice(i, 1);
            }
            // 灌木随滚动
            if (state === 'playing' && bushes) {
                for (const b of bushes) {
                    b.x -= speed * dt * 0.55;   // 近景视差更快
                    if (b.x < -120) { b.x = W + Math.random() * 120; b.s = 0.7 + Math.random() * 0.7; b.c = Math.floor(Math.random() * 3); }
                }
            }
        }

        /* =========================================================
           绘制
           ========================================================= */
        function draw() {
            ctx.save();
            if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

            drawSky();
            drawParallaxFar();
            drawClouds();
            drawParallaxMid();
            drawGround();
            drawBushes();
            drawObstacles();
            drawParticles();
            drawBall();
            drawPopups();

            ctx.restore();
            drawHUD();

            if (flash > 0.01) {
                ctx.fillStyle = `rgba(255,90,90,${flash * 0.45})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        /* 天空：随时间循环的昼夜渐变 */
        function drawSky() {
            const cycle = (Math.sin(timeAcc * 0.05) + 1) / 2;  // 0..1 缓慢变化
            const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 40);
            const top = mix([' #2b3a8f', ' #1b6fb5'], cycle);
            const mid = mix([' #7bb7e6', ' #7fc7e8'], cycle);
            const bot = mix([' #ffd9a0', ' #ffc98a'], cycle);
            g.addColorStop(0, top);
            g.addColorStop(0.55, mid);
            g.addColorStop(1, bot);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, GROUND_Y + 40);

            // 太阳/月亮
            const sx = W * 0.78, sy = 110;
            const halo = ctx.createRadialGradient(sx, sy, 10, sx, sy, 110);
            halo.addColorStop(0, 'rgba(255,245,190,0.95)');
            halo.addColorStop(0.4, 'rgba(255,220,140,0.45)');
            halo.addColorStop(1, 'rgba(255,220,140,0)');
            ctx.fillStyle = halo;
            ctx.beginPath(); ctx.arc(sx, sy, 110, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff6c0';
            ctx.beginPath(); ctx.arc(sx, sy, 42, 0, Math.PI * 2); ctx.fill();
        }

        /* 远景山脉（最慢） */
        function drawParallaxFar() {
            const off = (distance * 0.12) % 400;
            const baseY = GROUND_Y - 30;
            ctx.fillStyle = '#8fb7d9';
            for (let layer = 0; layer < 2; layer++) {
                ctx.globalAlpha = layer === 0 ? 0.55 : 0.85;
                ctx.fillStyle = layer === 0 ? '#9fc4e3' : '#7ea9cf';
                ctx.beginPath();
                ctx.moveTo(-100, baseY + 120);
                const step = 200;
                for (let x = -400 - off * (1 + layer * 0.4); x < W + 400; x += step) {
                    const h = 150 + ((Math.sin(x * 0.01 + layer * 5) + 1) / 2) * 130;
                    ctx.lineTo(x + step / 2, baseY - h + layer * 20);
                    ctx.lineTo(x + step, baseY + 120);
                }
                ctx.lineTo(W + 400, baseY + 160);
                ctx.lineTo(-100, baseY + 160);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        /* 中景圆丘 */
        function drawParallaxMid() {
            const off = (distance * 0.28) % 300;
            ctx.fillStyle = '#5fbf7a';
            ctx.beginPath();
            ctx.moveTo(-200, GROUND_Y + 30);
            for (let x = -400 - off; x < W + 400; x += 300) {
                const h = 90 + ((Math.sin(x * 0.02) + 1) / 2) * 70;
                ctx.quadraticCurveTo(x + 150, GROUND_Y - h, x + 300, GROUND_Y + 30);
            }
            ctx.lineTo(W + 400, GROUND_Y + 120);
            ctx.lineTo(-200, GROUND_Y + 120);
            ctx.closePath();
            ctx.fill();
        }

        function drawClouds() {
            for (const c of clouds) {
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = '#ffffff';
                const s = c.s;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 26 * s, 0, Math.PI * 2);
                ctx.arc(c.x + 28 * s, c.y + 6 * s, 20 * s, 0, Math.PI * 2);
                ctx.arc(c.x - 28 * s, c.y + 8 * s, 18 * s, 0, Math.PI * 2);
                ctx.arc(c.x + 4 * s, c.y - 14 * s, 20 * s, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        /* 地面：草皮 + 滚动纹路 */
        function drawGround() {
            // 主体
            const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            g.addColorStop(0, '#5ad06f');
            g.addColorStop(0.18, '#46bd5c');
            g.addColorStop(1, '#2f9448');
            ctx.fillStyle = g;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

            // 顶部亮边
            ctx.fillStyle = '#7ce88f';
            ctx.fillRect(0, GROUND_Y - 6, W, 8);

            // 滚动草地纹路（视差最快层）
            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 4;
            for (let x = -groundOffset; x < W + 80; x += 80) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y + 26);
                ctx.lineTo(x + 34, GROUND_Y + 26);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + 40, GROUND_Y + 58);
                ctx.lineTo(x + 62, GROUND_Y + 58);
                ctx.stroke();
            }
            // 深处碎石点
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            for (let x = -(groundOffset * 1.4) % 140; x < W; x += 140) {
                ctx.beginPath(); ctx.arc(x + 30, GROUND_Y + 90, 14, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 95, GROUND_Y + 130, 20, 0, Math.PI * 2); ctx.fill();
            }
        }

        /* 近景灌木（可爱卡通） */
        function drawBushes() {
            if (!bushes) return;
            const cols = ['#3fae5a', '#57c46f', '#35994f'];
            for (const b of bushes) {
                ctx.fillStyle = cols[b.c];
                const s = b.s;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 26 * s, Math.PI, Math.PI * 2);
                ctx.arc(b.x + 30 * s, b.y, 20 * s, Math.PI, Math.PI * 2);
                ctx.arc(b.x - 30 * s, b.y, 18 * s, Math.PI, Math.PI * 2);
                ctx.arc(b.x, b.y - 12 * s, 22 * s, Math.PI, Math.PI * 2);
                ctx.fill();
                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.20)';
                ctx.beginPath(); ctx.arc(b.x - 10 * s, b.y - 22 * s, 7 * s, 0, Math.PI * 2); ctx.fill();
            }
        }

        /* 障碍物：卡通方块带表情 */
        function drawObstacles() {
            for (const o of obstacles) {
                const r = 12;
                const x = o.x, y = o.y, w = o.w, h = o.h;

                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                roundRect(x + 6, y + 8, w, h, r); ctx.fill();

                // 主体
                const g = ctx.createLinearGradient(x, y, x, y + h);
                g.addColorStop(0, o.color);
                g.addColorStop(1, o.dark);
                ctx.fillStyle = g;
                roundRect(x, y, w, h, r); ctx.fill();

                // 描边
                ctx.strokeStyle = 'rgba(30,20,50,0.55)';
                ctx.lineWidth = 4;
                roundRect(x, y, w, h, r); ctx.stroke();

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.28)';
                roundRect(x + 6, y + 6, w * 0.34, h * 0.5, 8); ctx.fill();

                // 卡通表情
                if (o.face && w >= 38) {
                    const ex = x + w / 2;
                    const ey = y + h * 0.34;
                    const wob = Math.sin(o.bob) * 2;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(ex - w * 0.19, ey, w * 0.12, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(ex + w * 0.19, ey, w * 0.12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#241a3a';
                    ctx.beginPath(); ctx.arc(ex - w * 0.19 + wob, ey + 1, w * 0.06, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(ex + w * 0.19 + wob, ey + 1, w * 0.06, 0, Math.PI * 2); ctx.fill();
                    // 小嘴
                    ctx.strokeStyle = '#241a3a';
                    ctx.lineWidth = Math.max(2, w * 0.05);
                    ctx.beginPath();
                    if (w > 60) { ctx.arc(ex, y + h * 0.62, w * 0.14, 0.15 * Math.PI, 0.85 * Math.PI); }
                    else { ctx.moveTo(ex - w * 0.12, y + h * 0.62); ctx.quadraticCurveTo(ex, y + h * 0.72, ex + w * 0.12, y + h * 0.62); }
                    ctx.stroke();
                }
            }
        }

        /* 小球：彩色卡通脸 + 挤压拉伸 */
        function drawBall() {
            const sq = ball ? ball.squash : 0;
            const rx = BALL_R * (1 + sq * 0.6);
            const ry = BALL_R * (1 - sq * 0.6);
            const cx = BALL_X;
            const cy = ball ? ball.y : GROUND_Y - BALL_R;

            // 地面投影
            const airT = Math.max(0, (GROUND_Y - BALL_R - cy) / 200);
            ctx.globalAlpha = 0.28 * (1 - Math.min(0.85, airT));
            ctx.fillStyle = '#1c3a22';
            ctx.beginPath();
            ctx.ellipse(cx, GROUND_Y + 4, rx * 1.05, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // 拖尾残影（速度越快越明显）
            const spd = state === 'playing' ? (speed - SPEED_BASE) / (SPEED_MAX - SPEED_BASE) : 0;
            if (spd > 0.05) {
                for (let i = 3; i >= 1; i--) {
                    ctx.globalAlpha = 0.10 * spd * i;
                    ctx.fillStyle = '#ffb3c1';
                    ctx.beginPath();
                    ctx.ellipse(cx - i * 13, cy + i * 2, rx * (1 - i * 0.08), ry * (1 - i * 0.08), 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // 球体渐变
            const g = ctx.createRadialGradient(cx - rx * 0.35, cy - ry * 0.4, rx * 0.2, cx, cy, rx * 1.1);
            g.addColorStop(0, '#ffd0da');
            g.addColorStop(0.45, '#ff7d9c');
            g.addColorStop(1, '#e0345e');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();

            // 描边
            ctx.strokeStyle = 'rgba(60,20,45,0.55)';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 高光
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.ellipse(cx - rx * 0.34, cy - ry * 0.4, rx * 0.22, ry * 0.16, -0.6, 0, Math.PI * 2);
            ctx.fill();

            // 卡通脸
            const eyeY = cy - ry * 0.12;
            const eyeDX = rx * 0.34;
            const eyeR = rx * 0.26;
            const blink = ball ? ball.blink : 0;
            if (blink > 0.02) {
                // 眨眼：一条线
                ctx.strokeStyle = '#2a1030';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx - eyeDX - eyeR * 0.7, eyeY); ctx.lineTo(cx - eyeDX + eyeR * 0.7, eyeY);
                ctx.moveTo(cx + eyeDX - eyeR * 0.7, eyeY); ctx.lineTo(cx + eyeDX + eyeR * 0.7, eyeY);
                ctx.stroke();
            } else {
                // 眼白
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx - eyeDX, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + eyeDX, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
                // 瞳孔（看向前方）
                ctx.fillStyle = '#2a1030';
                ctx.beginPath(); ctx.arc(cx - eyeDX + eyeR * 0.35, eyeY + 1, eyeR * 0.52, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + eyeDX + eyeR * 0.35, eyeY + 1, eyeR * 0.52, 0, Math.PI * 2); ctx.fill();
                // 眼里的光点
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath(); ctx.arc(cx - eyeDX + eyeR * 0.1, eyeY - eyeR * 0.3, eyeR * 0.16, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + eyeDX + eyeR * 0.1, eyeY - eyeR * 0.3, eyeR * 0.16, 0, Math.PI * 2); ctx.fill();
            }

            // 嘴巴：跳跃时张嘴，落地时微笑
            ctx.strokeStyle = '#2a1030';
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (!ball || ball.onGround) {
                ctx.arc(cx, cy + ry * 0.28, rx * 0.3, 0.15 * Math.PI, 0.85 * Math.PI);
            } else {
                ctx.ellipse(cx, cy + ry * 0.35, rx * 0.16, ry * 0.14, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#7a1030'; ctx.fill();
            }
            ctx.stroke();

            // 腮红
            ctx.fillStyle = 'rgba(255,120,150,0.55)';
            ctx.beginPath(); ctx.arc(cx - rx * 0.62, cy + ry * 0.28, rx * 0.17, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + rx * 0.62, cy + ry * 0.28, rx * 0.17, 0, Math.PI * 2); ctx.fill();
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / p.max);
                ctx.fillStyle = p.c;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * (p.life / p.max), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawPopups() {
            for (const p of popups) {
                const a = Math.max(0, p.life / p.max);
                ctx.globalAlpha = a;
                ctx.font = 'bold 30px "Comic Sans MS", "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 6;
                ctx.strokeStyle = 'rgba(255,255,255,0.95)';
                ctx.strokeText(p.text, p.x, p.y);
                ctx.fillStyle = `hsl(${p.hue},90%,52%)`;
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        /* 分数 HUD */
        function drawHUD() {
            if (state === 'ready') return;
            ctx.textAlign = 'left';
            // 分数面板
            ctx.fillStyle = 'rgba(30,20,50,0.42)';
            roundRect(20, 18, 210, 66, 18); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px "Comic Sans MS", "Microsoft YaHei", sans-serif';
            ctx.fillText('分数', 38, 46);
            ctx.font = 'bold 32px "Comic Sans MS", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = '#ffe066';
            ctx.fillText(String(Math.floor(score)), 38, 76);

            // 最高分
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(30,20,50,0.42)';
            roundRect(W - 230, 18, 210, 66, 18); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px "Comic Sans MS", "Microsoft YaHei", sans-serif';
            ctx.fillText('最高分', W - 38, 46);
            ctx.font = 'bold 30px "Comic Sans MS", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = '#7ef29b';
            ctx.fillText(String(Math.max(best, Math.floor(score))), W - 38, 76);

            // 速度条
            const spd = Math.min(1, (speed - SPEED_BASE) / (SPEED_MAX - SPEED_BASE));
            ctx.fillStyle = 'rgba(30,20,50,0.30)';
            roundRect(W / 2 - 110, 26, 220, 16, 8); ctx.fill();
            const sg = ctx.createLinearGradient(W / 2 - 110, 0, W / 2 + 110, 0);
            sg.addColorStop(0, '#4ade80'); sg.addColorStop(0.5, '#ffd34e'); sg.addColorStop(1, '#ff5f6d');
            ctx.fillStyle = sg;
            roundRect(W / 2 - 110, 26, 220 * spd, 16, 8); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px "Comic Sans MS", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('速度', W / 2, 60);
            ctx.textAlign = 'left';
        }

        /* 圆角矩形路径（兼容性优于 ctx.roundRect） */
        function roundRect(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        /* 颜色混合：接收 [' #aaa',' #bbb'] 与 t(0..1)，返回 rgb 字符串 */
        function mix(pair, t) {
            const a = hexToRgb(pair[0].trim());
            const b = hexToRgb(pair[1].trim());
            const r = Math.round(a.r + (b.r - a.r) * t);
            const g = Math.round(a.g + (b.g - a.g) * t);
            const bl = Math.round(a.b + (b.b - a.b) * t);
            return `rgb(${r},${g},${bl})`;
        }
        function hexToRgb(h) {
            h = h.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
        }

        /* =========================================================
           循环驱动
           ========================================================= */
        function loop(ts) {
            if (!lastTs) lastTs = ts;
            let dt = (ts - lastTs) / 1000;
            lastTs = ts;
            if (dt > 0.05) dt = 0.05;   // 防止切标签后跳跃
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        /* 启动 */
        resetGame();
        state = 'ready';
        requestAnimationFrame(loop);
    </script>
</body>
