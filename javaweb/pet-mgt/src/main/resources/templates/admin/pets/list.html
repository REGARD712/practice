<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 后台宠物管理页：以表格维护宠物档案，支持查看、编辑、重新开放领养和带确认提示的删除操作。 -->
<head th:replace="~{fragments/common :: head('宠物管理')}"></head>
<body>
<nav th:replace="~{fragments/common :: header}"></nav><div th:replace="~{fragments/common :: flash}"></div>
<main class="admin-layout"><div class="container-fluid px-lg-5"><div class="row g-4">
    <!-- 侧边栏传入 pets，高亮“宠物管理”菜单。 -->
    <div class="col-lg-3 col-xl-2"><div th:replace="~{admin/fragments :: sidebar('pets')}"></div></div>
    <div class="col-lg-9 col-xl-10">
        <!-- 管理页头说明档案用途，并提供发布新宠物的快捷入口。 -->
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4"><div><span class="section-kicker">PET MANAGEMENT</span><h1 class="admin-heading mb-1">宠物档案</h1><p class="text-secondary mb-0">发布宠物、维护健康信息与领养状态。</p></div><a th:href="@{/admin/pets/new}" class="btn btn-primary rounded-pill"><i class="bi bi-plus-lg me-1"></i>发布宠物</a></div>
        <div class="content-card overflow-hidden"><div class="table-responsive"><table class="table"><thead><tr><th>宠物</th><th>品种</th><th>性别 / 年龄</th><th>健康状况</th><th>领养状态</th><th>发布时间</th><th class="text-end">操作</th></tr></thead><tbody>
        <!-- 遍历 pets：每行显示封面、编号、品种、性别年龄、健康状态、领养状态和发布时间。 -->
        <tr th:each="pet : ${pets}"><td><a class="table-pet" th:href="@{/pets/{id}(id=${pet.id})}" target="_blank"><img class="table-thumb" th:src="@{${pet.coverImage}}" th:alt="${pet.name}"><div><strong class="d-block" th:text="${pet.name}">宠物</strong><small class="text-secondary" th:text="'编号 #' + ${pet.id}">编号</small></div></a></td><td th:text="${pet.breed != null ? pet.breed : '未分类'}">品种</td><td th:text="|${pet.gender} / ${pet.ageMonths} 个月|">信息</td><td th:text="${pet.healthStatus}">健康</td><td><span class="state-label" th:classappend="'state-' + ${pet.status}" th:text="${pet.status == 'AVAILABLE' ? '待领养' : (pet.status == 'PENDING' ? '审核中' : '已领养')}">状态</span></td><td th:text="${#temporals.format(pet.createdAt,'yyyy-MM-dd')}">时间</td><td><!-- 后台操作：编辑进入档案表单；已领养宠物可重新开放；删除以 POST 提交，均由公共脚本弹出二次确认。 --><div class="action-group justify-content-end"><a class="btn btn-outline-primary" th:href="@{/admin/pets/{id}/edit(id=${pet.id})}" title="编辑"><i class="bi bi-pencil"></i></a><form th:if="${pet.status == 'ADOPTED'}" th:action="@{/admin/pets/{id}/reopen(id=${pet.id})}" method="post" data-confirm="确定将该宠物重新开放为待领养吗？请先确认领养已取消。"><button class="btn btn-outline-success" type="submit" title="重新开放领养"><i class="bi bi-arrow-counterclockwise"></i></button></form><form th:action="@{/admin/pets/{id}/delete(id=${pet.id})}" method="post" data-confirm="确定删除该宠物档案及已上传图片吗？"><button class="btn btn-outline-danger" type="submit" title="删除"><i class="bi bi-trash"></i></button></form></div></td></tr>
        </tbody></table></div><!-- 宠物列表为空时提示管理员创建第一份档案。 --><div class="empty-state border-0" th:if="${#lists.isEmpty(pets)}"><i class="bi bi-house-heart"></i><h3>还没有宠物档案</h3><p>点击“发布宠物”创建第一份档案。</p></div></div>
    </div>
</div></div></main>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body></html>
