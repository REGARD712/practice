<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 后台品种管理页：展示品种及关联宠物数量，支持新增、改名和删除。 -->
<head th:replace="~{fragments/common :: head('品种管理')}"></head>
<body>
<nav th:replace="~{fragments/common :: header}"></nav><div th:replace="~{fragments/common :: flash}"></div>
<main class="admin-layout"><div class="container-fluid px-lg-5"><div class="row g-4">
    <!-- 侧边栏传入 breeds，高亮“品种管理”菜单。 -->
    <div class="col-lg-3 col-xl-2"><div th:replace="~{admin/fragments :: sidebar('breeds')}"></div></div>
    <div class="col-lg-9 col-xl-10">
        <div class="mb-4"><span class="section-kicker">BREED MANAGEMENT</span><h1 class="admin-heading mb-1">宠物品种</h1><p class="text-secondary mb-0">维护品种资料；新增后立即出现在宠物表单和前台筛选列表中。</p></div>
        <!-- 新增品种表单：名称与物种都由服务端校验，品种名称不允许重复。 -->
        <form th:action="@{/admin/breeds}" method="post" th:object="${breedForm}" class="content-card p-4 mb-4"><div class="row g-3 align-items-end"><div class="col-md-5"><label for="name" class="form-label required">品种名称</label><input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}" maxlength="80" placeholder="例如：中华田园猫"><div class="invalid-feedback" th:errors="*{name}">请输入品种名称</div></div><div class="col-md-3"><label for="species" class="form-label required">物种</label><select class="form-select" th:classappend="${#fields.hasErrors('species')} ? 'is-invalid'" id="species" th:field="*{species}"><option value="">请选择物种</option><option value="猫">猫</option><option value="犬">犬</option><option value="其他">其他</option></select><div class="invalid-feedback" th:errors="*{species}">请选择物种</div></div><div class="col-md-2"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-lg me-1"></i>新增品种</button></div></div></form>
        <div class="content-card overflow-hidden"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>品种名称</th><th>物种</th><th>关联宠物</th><th class="text-end">操作</th></tr></thead><tbody>
        <!-- 每行内联改名表单；删除通过 POST 提交并带二次确认，仍有宠物引用时由服务端拒绝并说明。 -->
        <tr th:each="breed : ${breeds}"><td class="text-secondary" th:text="${breed.id}">1</td><td><form class="d-flex gap-2 align-items-center" th:action="@{/admin/breeds/{id}(id=${breed.id})}" method="post"><input class="form-control form-control-sm" type="text" name="name" th:value="${breed.name}" maxlength="80" required aria-label="品种名称"><button class="btn btn-sm btn-outline-primary" type="submit" title="保存名称"><i class="bi bi-check2"></i>保存</button></form></td><td th:text="${breed.species}">犬</td><td><span class="state-label" th:classappend="${breed.petCount > 0} ? 'state-PENDING' : 'state-AVAILABLE'" th:text="${breed.petCount} + ' 只'">0 只</span></td><td><div class="action-group justify-content-end"><form th:action="@{/admin/breeds/{id}/delete(id=${breed.id})}" method="post" data-confirm="确定删除该品种吗？若仍有宠物使用该品种，系统会拒绝删除。"><button class="btn btn-outline-danger" type="submit" title="删除"><i class="bi bi-trash"></i></button></form></div></td></tr>
        </tbody></table></div><!-- 没有任何品种时显示空状态。 --><div class="empty-state border-0" th:if="${#lists.isEmpty(breeds)}"><i class="bi bi-tags"></i><h3>暂无品种</h3></div></div>
    </div>
</div></div></main>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body></html>
