<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 后台用户新增/编辑共用表单：维护账号资料、登录密码、角色分配和启用状态。 -->
<head th:replace="~{fragments/common :: head(${userForm.id == null ? '新增用户' : '编辑用户'})}"></head>
<body>
<nav th:replace="~{fragments/common :: header}"></nav><div th:replace="~{fragments/common :: flash}"></div>
<main class="admin-layout"><div class="container-fluid px-lg-5"><div class="row g-4">
    <!-- 新增与编辑均传入 users，保持“用户管理”菜单选中。 -->
    <div class="col-lg-3 col-xl-2"><div th:replace="~{admin/fragments :: sidebar('users')}"></div></div>
    <div class="col-lg-9 col-xl-10">
        <div class="mb-4"><a th:href="@{/admin/users}" class="text-link"><i class="bi bi-arrow-left me-1"></i>返回用户列表</a><h1 class="admin-heading mt-3" th:text="${userForm.id == null ? '新增用户' : '编辑用户'}">用户表单</h1></div>
        <!-- 根据 userForm.id 是否为空切换新增或编辑提交地址，表单统一绑定 userForm。 -->
        <form th:action="${userForm.id == null} ? @{/admin/users} : @{/admin/users/{id}(id=${userForm.id})}" th:object="${userForm}" method="post" class="content-card p-4 p-md-5 needs-validation" novalidate>
            <!-- 循环展示用户保存过程中的服务端全局业务错误。 -->
            <div class="alert alert-danger border-0" th:if="${#fields.hasGlobalErrors()}"><ul class="mb-0"><li th:each="message : ${#fields.globalErrors()}" th:text="${message}">业务错误</li></ul></div>
            <!-- 隐藏 id 用于编辑既有用户；新增用户时该字段为空。 -->
            <input type="hidden" th:field="*{id}">
            <div class="row g-4">
                <!-- 用户名必填，格式为 3–20 位字母、数字或下划线，并回显字段错误。 -->
                <div class="col-md-6"><label for="username" class="form-label required">用户名</label><input type="text" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" id="username" th:field="*{username}" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required><div class="invalid-feedback" th:errors="*{username}">3–20 位字母、数字或下划线</div></div>
                <!-- 新增用户必须设置至少 6 位密码；编辑时留空表示保持原密码不变。 -->
                <div class="col-md-6"><label for="password" class="form-label" th:classappend="${userForm.id == null} ? 'required'">密码</label><input type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" th:field="*{password}" minlength="6" th:required="${userForm.id == null}" th:placeholder="${userForm.id == null ? '至少 6 位' : '留空则不修改密码'}" autocomplete="new-password"><div class="invalid-feedback" th:errors="*{password}">至少 6 位</div></div>
                <!-- 邮箱使用 email 类型进行必填和格式校验。 -->
                <div class="col-md-6"><label for="email" class="form-label required">邮箱</label><input type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" th:field="*{email}" required><div class="invalid-feedback" th:errors="*{email}">请输入有效邮箱</div></div>
                <!-- 联系电话为必填手机号，pattern 与字段错误提示共同完成校验反馈。 -->
                <div class="col-md-6"><label for="phone" class="form-label required">联系电话</label><input type="tel" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" id="phone" th:field="*{phone}" pattern="1[3-9][0-9]{9}" required><div class="invalid-feedback" th:errors="*{phone}">请输入有效手机号</div></div>
                <!-- 遍历 roles 生成角色复选框，roleIds 支持多选；标签说明各角色权限范围。 -->
                <div class="col-12"><label class="form-label required">分配角色</label><div class="d-flex flex-wrap gap-3"><div class="form-check" th:each="role : ${roles}"><input class="form-check-input" type="checkbox" th:id="'role-' + ${role.id}" th:field="*{roleIds}" th:value="${role.id}"><label class="form-check-label" th:for="'role-' + ${role.id}" th:text="${role.roleName == 'ROLE_ADMIN' ? '管理员（全部后台权限）' : '普通用户（浏览与申请领养）'}">角色</label></div></div><div class="invalid-feedback" th:if="${#fields.hasErrors('roleIds')}" th:errors="*{roleIds}" style="display:block">请分配角色</div></div>
                <!-- 启用开关绑定 enabled；取消勾选后账号保留但无法登录。 -->
                <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="enabled" th:field="*{enabled}"><label class="form-check-label" for="enabled">账号可用（停用后该用户无法登录）</label></div></div>
                <!-- 保存提交用户资料，取消则不保存并返回用户列表。 -->
                <div class="col-12 d-flex gap-2 pt-2"><button class="btn btn-primary px-4" type="submit"><i class="bi bi-check-lg me-1"></i>保存用户</button><a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4">取消</a></div>
            </div>
        </form>
    </div>
</div></div></main>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body></html>
