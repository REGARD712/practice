<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>产品列表</title>
    <style>
        body {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
            color: #243044;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .product-card {
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgb(15 23 42 / 6%);
        }

        .product-card h2 {
            margin-top: 0;
        }

        .price {
            color: #2563eb;
            font-weight: bold;
        }

        .low-stock {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>
<body>
<header class="header">
    <h1>产品列表</h1>
    <a th:href="@{/}">首页</a>
</header>

<main class="product-list">
    <th:block th:each="product : ${products}">
        <div th:replace="~{fragments/product-card :: productCard(${product})}"></div>
    </th:block>
</main>
</body>
</html>
