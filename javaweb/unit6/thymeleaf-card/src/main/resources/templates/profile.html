<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人资料</title>
</head>
<body>
<!-- 页面主标题 -->
<h1 th:text="'你好，我是' + ${name}">李港</h1>
<hr>

<h2>基本信息</h2>
<ul>
    <li>姓名：<span th:text="${name}">李港</span></li>
    <li>年龄：<span th:text="${age}">25</span>岁</li>
    <li>邮箱：<span th:text="${email}">email@example.com</span></li>
</ul>

<h2>个人简介</h2>
<p th:text="${bio}">这里是简介内容</p>

<h2>技能清单</h2>
<ul>
    <li th:each="skill : ${skills}" th:text="${skill}">Java</li>
</ul>

<h2>页面信息</h2>
<!-- LocalDateTime 必须用 #temporals，不能用 #dates -->
<p>生成时间：<span th:text="${#temporals.format(now, 'yyyy-MM-dd HH:mm:ss')}">2025-01-01 12:00:00</span></p>

<!-- 内置对象练习 -->
<p th:if="${#strings.length(name) > 2}">姓名长度大于2</p>
</body>
</html>
