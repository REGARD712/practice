<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>消息列表 - iMessage</title>
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>消息列表</h1>
    <a th:href="@{/messages/add}" class="btn btn-primary mb-3">发布新消息</a>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th><th>标题</th><th>内容</th><th>作者</th><th>分类</th><th>创建时间</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="msg : ${messages}">
            <td th:text="${msg.id}">...</td>
            <td th:text="${msg.title}">...</td>
            <td th:text="${msg.content}">...</td>
            <td th:text="${msg.user.username}">...</td>
            <td th:text="${msg.category.name}">...</td>
            <td th:text="${#dates.format(msg.createTime, 'yyyy-MM-dd HH:mm')}">...</td>
            <td>
                <a th:href="@{/messages/edit/{id}(id=${msg.id})}" class="btn btn-sm btn-warning">编辑</a>
                <form th:action="@{/messages/{id}(id=${msg.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确定删除该消息？')">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
