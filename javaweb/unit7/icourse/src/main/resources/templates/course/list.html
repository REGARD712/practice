<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>课程列表</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<main class="container py-4 py-md-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">课程列表</h1>
        <a class="btn btn-primary" th:href="@{/courses/add}">新增课程</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(courses)}">
        <div class="col" th:each="course : ${courses}">
            <article class="card h-100 shadow-sm">
                <img class="card-img-top object-fit-cover"
                     style="height: 210px"
                     th:src="${course.coverUrl != null and !course.coverUrl.isEmpty()} ? ${course.coverUrl} : (${course.name != null and course.name.toLowerCase().contains('java')} ? '/course-covers/java-programming.svg' : (${course.name != null and course.name.toLowerCase().contains('spring')} ? '/course-covers/spring-boot.svg' : '/course-covers/general-course.svg'))"
                     th:data-cover-fallback="${course.name != null and course.name.toLowerCase().contains('java') ? '/course-covers/java-programming.svg' : (course.name != null and course.name.toLowerCase().contains('spring') ? '/course-covers/spring-boot.svg' : '/course-covers/general-course.svg')}"
                     alt="课程封面">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="${course.name}"></h2>
                    <p class="card-text text-secondary flex-grow-1"
                       th:text="${course.description != null and !course.description.isEmpty() ? course.description : '暂无课程简介'}"></p>
                    <p class="small text-muted mb-3">
                        教师：<span th:text="${course.teacherName}"></span>
                    </p>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/courses/edit/{id}(id=${course.id})}">编辑</a>
                        <form th:action="@{/courses/{id}(id=${course.id})}" method="post">
                            <input type="hidden" name="_method" value="delete">
                            <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(courses)}">暂无课程</div>
</main>
<script>
    document.querySelectorAll("img[data-cover-fallback]").forEach((image) => {
        image.addEventListener("error", () => {
            const fallback = image.dataset.coverFallback;
            if (fallback && image.getAttribute("src") !== fallback) {
                image.src = fallback;
            }
        });
    });
</script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
