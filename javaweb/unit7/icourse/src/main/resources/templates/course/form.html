<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editMode} ? '编辑课程' : '新增课程'">课程表单</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body>
<main class="container py-4">
    <h1 class="h3 mb-4" th:text="${editMode} ? '编辑课程' : '新增课程'">课程表单</h1>

    <form th:action="${editMode} ? @{/courses/{id}(id=${course.id})} : @{/courses}"
          method="post" enctype="multipart/form-data" class="row g-3">
        <input th:if="${editMode}" type="hidden" name="_method" value="put">

        <div class="col-12">
            <label for="name" class="form-label">课程名称</label>
            <input id="name" name="name" type="text" class="form-control"
                   th:value="${course.name}" required>
        </div>

        <div class="col-12">
            <label for="description" class="form-label">简介</label>
            <textarea id="description" name="description" class="form-control" rows="4"
                      th:text="${course.description}"></textarea>
        </div>

        <div class="col-12">
            <label for="cover" class="form-label">封面图片</label>
            <input id="cover" name="cover" type="file" class="form-control" accept="image/*">
            <div class="mt-2" th:if="${editMode}">
                <p class="form-text mb-1">当前封面（选择新图片可替换）</p>
                <img th:src="${course.coverUrl != null and !course.coverUrl.isEmpty()} ? ${course.coverUrl} : (${course.name != null and course.name.toLowerCase().contains('java')} ? '/course-covers/java-programming.svg' : (${course.name != null and course.name.toLowerCase().contains('spring')} ? '/course-covers/spring-boot.svg' : '/course-covers/general-course.svg'))"
                     alt="当前课程封面" class="img-thumbnail" width="120"
                     th:data-cover-fallback="${course.name != null and course.name.toLowerCase().contains('java') ? '/course-covers/java-programming.svg' : (course.name != null and course.name.toLowerCase().contains('spring') ? '/course-covers/spring-boot.svg' : '/course-covers/general-course.svg')}">
            </div>
        </div>

        <div class="col-12">
            <label for="teacherId" class="form-label">教师</label>
            <select id="teacherId" name="teacherId" class="form-select" required>
                <option value="">请选择教师</option>
                <option th:each="teacher : ${teachers}" th:value="${teacher.id}"
                        th:text="${teacher.username}" th:selected="${teacher.id == course.teacherId}"></option>
            </select>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">保存</button>
            <a class="btn btn-outline-secondary" th:href="@{/courses}">取消</a>
        </div>
    </form>
</main>
<script>
    document.querySelectorAll("img[data-cover-fallback]").forEach((image) => {
        image.addEventListener("error", () => {
            const fallback = image.dataset.coverFallback;
            if (fallback && !image.dataset.fallbackApplied) {
                image.dataset.fallbackApplied = "true";
                image.src = fallback;
            }
        });
    });
</script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
