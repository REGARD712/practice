<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - Course System</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Course System 登录</h1>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label class="form-label" for="username">用户名</label>
                            <input class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">密码</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">登录</button>
                    </form>
                    <p class="small text-muted mt-3 mb-0">账号由管理员创建，请使用数据库中的用户账号登录。</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
