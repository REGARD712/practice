<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的课程</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: bar}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">我的课程</h1>
        <a class="btn btn-primary" href="/teacher/courses/new">发布课程</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>封面</th><th>名称</th><th>价格</th><th>发布时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="course : ${courses}">
                <td><img th:src="${course.coverUrl != null ? course.coverUrl : '/images/course-placeholder.svg'}"
                         onerror="this.onerror=null;this.src='/images/course-placeholder.svg'"
                         alt="课程封面" width="60" height="60" class="rounded object-fit-cover"></td>
                <td th:text="${course.name}"></td>
                <td th:text="|¥${course.price}|"></td>
                <td th:text="${course.createTime}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/teacher/courses/{id}/edit(id=${course.id})}">编辑</a>
                    <form class="d-inline" method="post" th:action="@{/teacher/courses/{id}/delete(id=${course.id})}"
                          onsubmit="return confirm('确定删除这门课程吗？已选记录也会一并删除。')">
                        <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courses)}"><td colspan="5" class="text-center text-muted">暂未发布课程</td></tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/nav :: scripts}"></th:block>
</body>
</html>
