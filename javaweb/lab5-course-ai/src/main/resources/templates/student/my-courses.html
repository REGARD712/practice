<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的课程</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: bar}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <h1 class="h3 mb-3">我的课程</h1>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>封面</th><th>课程</th><th>教师</th><th>选课时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="enrollment : ${enrollments}">
                <td><img th:src="${enrollment.course.coverUrl != null ? enrollment.course.coverUrl : '/images/course-placeholder.svg'}"
                         onerror="this.onerror=null;this.src='/images/course-placeholder.svg'"
                         alt="课程封面" width="60" height="60" class="rounded object-fit-cover"></td>
                <td>
                    <div class="fw-semibold" th:text="${enrollment.course.name}"></div>
                    <div class="small text-muted" th:text="${enrollment.course.description}"></div>
                </td>
                <td th:text="${enrollment.course.teacher != null ? enrollment.course.teacher.username : ''}"></td>
                <td th:text="${enrollment.enrollTime}"></td>
                <td>
                    <form method="post" th:action="@{/student/my-courses/{id}/withdraw(id=${enrollment.courseId})}"
                          onsubmit="return confirm('确定退选这门课程吗？')">
                        <button class="btn btn-sm btn-outline-danger" type="submit">退课</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="5" class="text-center text-muted">还没有选课，去<a href="/student/courses">浏览课程</a>吧。</td></tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/nav :: scripts}"></th:block>
</body>
</html>
