<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: bar}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">用户管理</h1>
        <a class="btn btn-primary" href="/admin/users/new">新增用户</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td>
                    <span class="badge text-bg-primary" th:if="${user.role.name() == 'STUDENT'}">学生</span>
                    <span class="badge text-bg-success" th:if="${user.role.name() == 'TEACHER'}">教师</span>
                    <span class="badge text-bg-dark" th:if="${user.role.name() == 'ADMIN'}">管理员</span>
                </td>
                <td th:text="${user.createTime}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">编辑</a>
                    <form class="d-inline" method="post" th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                          onsubmit="return confirm('确定删除该用户吗？')">
                        <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/nav :: scripts}"></th:block>
</body>
</html>
