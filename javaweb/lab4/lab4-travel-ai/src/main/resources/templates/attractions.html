<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::main})}">
<main>
    <section class="page-hero py-5">
        <div class="container py-2">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <p class="text-success fw-semibold mb-2">TRAVEL COLLECTION</p>
                    <h1 class="h2 fw-bold mb-2">旅游景点分享</h1>
                    <p class="text-secondary mb-0">发现值得收藏的风景与旅途故事</p>
                </div>
                <button type="button" class="btn btn-success px-4">
                    <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>新增景点
                </button>
            </div>
        </div>
    </section>

    <section class="container py-4 py-md-5">
        <div class="row g-3 align-items-center mb-4">
            <div class="col-12 col-md">
                <label for="attractionSearch" class="visually-hidden">搜索景点</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search" aria-hidden="true"></i></span>
                    <input id="attractionSearch" type="search" class="form-control"
                           placeholder="搜索景点名称或地点">
                </div>
            </div>
            <div class="col-12 col-md-4 col-lg-3">
                <label for="ratingFilter" class="visually-hidden">按评分筛选</label>
                <select id="ratingFilter" class="form-select" aria-label="按最低评分筛选景点">
                    <option value="0" selected>全部</option>
                    <option value="4">4 星及以上</option>
                    <option value="3">3 星及以上</option>
                    <option value="2">2 星及以上</option>
                    <option value="1">1 星及以上</option>
                </select>
            </div>
        </div>

        <div id="attractionList" class="row g-4">
            <div class="col-12 col-md-6 col-xl-4 attraction-item"
                 th:each="attraction : ${attractions}"
                 th:attr="data-rating=${attraction.rating}">
                <article class="card attraction-card h-100 shadow-sm overflow-hidden">
                    <img class="card-img-top attraction-image"
                         th:src="${#strings.isEmpty(attraction.imageUrl) ? '/assets/attraction-placeholder.svg' : attraction.imageUrl}"
                         th:alt="${attraction.name}"
                         onerror="this.onerror=null; this.src='/assets/attraction-placeholder.svg';">
                    <div class="card-body d-flex flex-column p-4">
                        <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                            <h2 class="h5 fw-bold mb-0" th:text="${attraction.name}">景点名称</h2>
                            <span class="badge rounded-pill text-bg-light text-success flex-shrink-0">
                                <i class="bi bi-geo-alt me-1" aria-hidden="true"></i>
                                <span th:text="${attraction.location}">地点</span>
                            </span>
                        </div>
                        <p class="text-secondary small mb-3" th:text="${attraction.description}">景点介绍</p>
                        <div class="d-flex align-items-center gap-2 mb-4 mt-auto"
                             th:attr="aria-label='评分 ' + ${attraction.rating} + ' / 5.0'">
                            <span class="rating-stars" aria-hidden="true">
                                <th:block th:each="star : ${#numbers.sequence(1, 5)}">
                                    <i th:class="${star <= attraction.rating ? 'bi bi-star-fill' : (star - attraction.rating <= 0.5 ? 'bi bi-star-half' : 'bi bi-star rating-empty')}"></i>
                                </th:block>
                            </span>
                            <span class="small text-secondary"
                                  th:text="${attraction.rating} + ' / 5.0'">5.0 / 5.0</span>
                        </div>
                        <div class="d-flex gap-2 border-top pt-3">
                            <button type="button" class="btn btn-outline-success btn-sm">
                                <i class="bi bi-pencil me-1" aria-hidden="true"></i>编辑
                            </button>
                            <button type="button" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash me-1" aria-hidden="true"></i>删除
                            </button>
                        </div>
                    </div>
                </article>
            </div>
        </div>
        <p id="noAttractionsMessage" class="text-center text-secondary py-5 d-none">
            没有符合该评分条件的景点。
        </p>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const ratingFilter = document.getElementById('ratingFilter');
            const attractionItems = Array.from(document.querySelectorAll('.attraction-item'));
            const emptyMessage = document.getElementById('noAttractionsMessage');

            function filterAttractions() {
                const minimumRating = Number(ratingFilter.value);
                let visibleCount = 0;

                attractionItems.forEach(function (item) {
                    const isVisible = Number(item.dataset.rating) >= minimumRating;
                    item.classList.toggle('d-none', !isVisible);
                    if (isVisible) {
                        visibleCount += 1;
                    }
                });

                emptyMessage.classList.toggle('d-none', visibleCount > 0);
            }

            ratingFilter.addEventListener('change', filterAttractions);
            filterAttractions();
        });
    </script>
</main>
</html>
