<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='消息中心', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>消息中心</h1>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button class="btn btn-outline-danger">退出登录</button>
                </form>
            </div>
            <div class="row">
                <!-- 左侧：发送消息表单 -->
                <div class="col-md-4">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-success text-white">发送新消息</div>
                        <div class="card-body">
                            <form th:action="@{/message/send}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">内容</label>
                                    <textarea name="content" class="form-control" rows="3" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100">发送
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="card shadow-sm">
                        <div class="card-header bg-info text-white">当前用户</div>
                        <div class="card-body">
                            <p><strong>用户名：</strong> <span th:text="${#authentication.name}"></span></p>
                            <p><strong>权限：</strong> <span th:text="${#authentication.authorities}"></span></p>
                        </div>
                    </div>
                </div>
                <!-- 右侧：消息列表 -->
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">消息列表</div>
                        <div class="card-body">
                            <div th:if="${messages.empty}" class="alert alert-warning">暂无消息</div>
                            <div th:each="msg : ${messages}" class="card mb-2">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <strong th:text="${msg.username}"></strong>
                                            <small class="text-muted ms-2"
                                                th:text="${#dates.format(msg.createTime, 'yyyy-MM-dd HH:mm:ss')}"></small>
                                        </div>
                                        <div>
                                            <form th:action="@{/message/delete/{id}(id=${msg.id})}" method="post">
                                                <input type="hidden" name="_method" value="DELETE">
                                                <button type="submit" class="btn btn-sm btn-danger"
                                                    onclick="return confirm('确定删除此消息吗？');">删除</button>
                                            </form>
                                        </div>
                                    </div>
                                    <p class="mt-2 mb-0" th:text="${msg.content}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
