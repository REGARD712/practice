<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='用户登录', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="container mt-5" style="max-width: 500px;">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">用户登录</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                        <div th:if="${param.error}" class="alert alert-danger mt-3">用户名或密码错误</div>
                        <div th:if="${param.logout}" class="alert alert-info mt-3">您已成功退出</div>
                        <div th:if="${param.registered}" class="alert alert-success mt-3">注册成功，请登录</div>
                    </form>
                    <hr>
                    <a th:href="@{/register}" class="btn btn-link w-100">没有账号？立即注册
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
