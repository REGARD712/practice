<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='用户注册', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="container mt-5" style="max-width: 500px;">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">用户注册</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">注册</button>
                    </form>
                    <hr>
                    <a th:href="@{/login}" class="btn btn-link w-100">已有账号？去登录</a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
