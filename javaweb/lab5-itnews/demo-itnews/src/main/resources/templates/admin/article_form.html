<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout::head(title=~{::title/text()})}">
    <meta charset="UTF-8">
    <title>ITNews : 新闻表单</title>
</head>

<body>
    <nav th:replace="layout :: navbar"></nav>
    <main class="container mt-4">
        <h1 th:if="${article.id == null}">发布新闻</h1>
        <h1 th:if="${article.id != null}">编辑新闻</h1>
        <form th:action="@{/admin/articles/save}" method="post" th:object="${article}">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">标题</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">内容</label>
                <textarea th:field="*{content}" class="form-control" rows="6" required>
</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">分类</label>
                <select th:field="*{categoryId}" class="form-select" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">作者</label>
                <select th:field="*{userId}" class="form-select" required>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/articles" class="btn btn-secondary">返回</a>
        </form>
    </main>
    <footer th:replace="layout :: footer"></footer>
</body>

</html>
