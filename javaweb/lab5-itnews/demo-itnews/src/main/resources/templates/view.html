<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout::head(title=~{::title/text()})}">
    <meta charset="UTF-8">
    <title>ITNews : 新闻内容</title>
</head>

<body>
    <nav th:replace="layout :: navbar"></nav>
    <main class="container mt-4">
        <h3 th:text="${article.title}">标题</h3>
        <small>
            分类：<span th:text="${article.category.name}"></span> |
            作者：<span th:text="${article.user.username}"></span> |
            发布时间：<span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd
HH:mm')}"></span>
        </small>
        <p th:text="${article.content}" class="mt-3" style="white-space: pre-wrap;">内容</p>
    </main>
    <footer th:replace="layout :: footer"></footer>
</body>

</html>
