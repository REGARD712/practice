<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--布局页头部片段,片段名 ~{layout::head},未来由内容页取用-->

<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="${title}">布局页</title>
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
</head>
<!--头部片段结束-->

<body>
    <!--布局页-导航栏片段,片段名 ~{layout::navbar},未来由内容页取用-->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg " style="background-color:
#e3f2fd;">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/logo.png" alt="Logo" width="30" height="24" class="dinline-
block align-text-top">
                ITNews
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bstarget="#
            navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle
            navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/articles">新闻管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/categories">分类管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">关于</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">[SSM框架版]</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--导航栏片段结束-->
    <!--内容部分,由各内容区块整入-->
    <!--布局页-页尾片段,片段名 ~{layout::footer},未来由内容页取用 -->
    <footer th:fragment="footer" class="text-center mt-5 py-3 bg-light">
        <span>&copy;2026版权所有/联系我:李港skhsu@foxmail.com</span>
        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </footer>
    <!--页尾片段结束-->
</body>

</html>
